# Tiny Tapeout project information
project:
  title:        "Noise-Shaping SAR ADC with scan test"
  author:       "Silicon Edge"
  discord:      ""
  description:  "8-bit differential SAR ADC with first-order error-feedback noise shaping (OSR 8) and a scan-testable digital controller"
  language:     "Analog"
  clock_hz:     96000      # conversion clock on clk (12 clocks per sample -> 8 kS/s)

  # Analog projects: 1x2 or 2x2 tiles
  tiles: "2x2"

  # Number of analog pins used (0-6). Only ua[0..analog_pins-1] are connected to pads.
  analog_pins: 6

  # No 3.3 V analog supply; the design runs from VDPWR (1.8 V)
  uses_vapwr: false

  # Must start with tt_um_ and match the GDS/LEF file names
  top_module:  "tt_um_silicon_edge_ns_sar_adc"

  # Blackbox stub for shuttle integration (in ./src)
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "NS_EN (1 = noise shaping on)"
  ui[1]: "AMP_SHARE"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "B[0] (LSB)"
  uo[1]: "B[1]"
  uo[2]: "B[2]"
  uo[3]: "B[3]"
  uo[4]: "B[4]"
  uo[5]: "B[5]"
  uo[6]: "B[6]"
  uo[7]: "B[7] (MSB)"

  # Bidirectional pins
  uio[0]: "EOC (output)"
  uio[1]: "SCAN_EN (input, hold low for normal operation)"
  uio[2]: "SCAN_IN (input)"
  uio[3]: "SCAN_OUT (output)"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins - make sure to also set "analog_pins" above, otherwise the pins won't be connected!
  ua[0]: "V_N (differential negative input, 0-1.8 V)"
  ua[1]: "V_P (differential positive input, 0-1.8 V)"
  ua[2]: "VCM (0.9 V common mode)"
  ua[3]: "VREF_P (1.8 V)"
  ua[4]: "VREF_N (0 V)"
  ua[5]: "IBIAS (bias current input)"

# Do not change!
yaml_version: 6
